<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Футуристический кампус регионального центра СПО</title>
  <desc id="desc">Концептуальный эскиз трёхэтажного кампуса с прозрачным атриумом, производственными мастерскими и цифровым ядром.</desc>
  <defs>
