    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#8fe8ff" stop-opacity=".72"/><stop offset="1" stop-color="#3f5de4" stop-opacity=".18"/></linearGradient>
    <linearGradient id="lime" x2="1"><stop stop-color="#c9ff50"/><stop offset="1" stop-color="#62f2dd"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8aa4ef" stroke-opacity=".13"/></pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
