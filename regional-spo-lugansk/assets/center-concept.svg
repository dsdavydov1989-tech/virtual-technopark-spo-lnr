<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Эскиз регионального центра СПО в Луганске</title>
  <desc id="desc">Трёхэтажный кампус с остеклённым атриумом, мастерскими, общественной площадью и озеленением.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c8dce2"/><stop offset="1" stop-color="#f4eee4"/></linearGradient>
    <linearGradient id="walls" x2="0" y2="1"><stop stop-color="#f5f1e9"/><stop offset="1" stop-color="#d5d5cc"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#a3c2cd"/><stop offset=".48" stop-color="#417080"/><stop offset="1" stop-color="#1b3d4e"/></linearGradient>
    <linearGradient id="side" x2="0" y2="1"><stop stop-color="#c2cac4"/><stop offset="1" stop-color="#84948e"/></linearGradient>
    <pattern id="windows" width="72" height="90" patternUnits="userSpaceOnUse"><rect x="5" y="8" width="55" height="57" rx="2" fill="url(#glass)"/><path d="M32 8v57M5 37h55" stroke="#d8e2db" stroke-width="3"/><path d="M9 13 28 10 10 53" fill="#d5e6e4" opacity=".28"/></pattern>
    <pattern id="louvres" width="22" height="25" patternUnits="userSpaceOnUse"><path d="M8 0v25" stroke="#bdc5bb" stroke-width="7" opacity=".72"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="19"/></filter>
  </defs>
