<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
  <title id="title">Пластина с прямоугольным карманом</title><desc id="desc">Пластина 80 на 60 мм и карман 40 на 30 мм глубиной 2 мм с радиусом внутренних углов 5 мм.</desc>
