  <g fill="#182d62" font-family="Arial,sans-serif" font-size="14"><text x="215" y="31">80 мм</text><text x="405" y="128">60 мм</text><text x="220" y="77">40 мм</text><text x="222" y="134" fill="#fff">30 мм</text><text x="166" y="164" fill="#fff">Z−2</text><text x="27" y="241">G54 (0;0) ↗</text></g>
