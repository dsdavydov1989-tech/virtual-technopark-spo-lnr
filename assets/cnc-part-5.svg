<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="title desc">
  <title id="title">Пластина с четырьмя отверстиями</title><desc id="desc">Пластина 80 на 60 мм толщиной 8 мм и четыре сквозных отверстия диаметром 6 мм.</desc>
